# Battery monitor (nala_base/battery_node): TI INA219 on the Pi I2C bus 1 (GPIO2 SDA, GPIO3 SCL, 3.3 V).
# IN+ and IN- are shorted: only the battery voltage is measured, no current (docs/battery.md).
# Battery: 4S2P Li-ion 18650, 3300 mAh per cell -> 4 cells in series, 6.6 Ah.
# Publishes /battery_state (sensor_msgs/BatteryState) and /battery_low (std_msgs/Bool).
# The percentage is only rough: linear between empty_voltage and full_voltage, but the real
# discharge curve is not linear and the voltage sags under load.
battery_node:
  ros__parameters:
    i2c_bus: 1                  # /dev/i2c-1
    i2c_address: 64             # 0x40 = INA219 (user, 2026-10-21). Check with `i2cdetect -y 1`
    publish_rate: 1.0           # Hz
    full_voltage: 16.8          # V, 4.2 V per cell = 100 %
    low_voltage: 14.4           # V, 3.6 V per cell: /battery_low becomes true and the node warns
    empty_voltage: 12.8         # V, 3.2 V per cell = 0 %
    design_capacity: 6.6        # Ah, 2 x 3.3 Ah
