# Settings of scripts/tune_motors.py (MCU speed controller tuning, firmware v2.2.0 setting mode). Runs on the Pi.
# The robot numbers (UART, wheel radius, encoder counts) come from config/base.yaml.
# The controller parameters themselves are NOT here: they live in the MCU (RAM, saved in its EEPROM).
tune_motors:
  pre_time: 0.5            # s of zero command before a step
  post_time: 1.5           # s of zero command after a step (the wheels coast to a stop)
  step_time: 2.0           # s, default length of a step (step, sweep)
  sweep_speeds: [0.05, 0.10, 0.20, 0.30]   # m/s wheel rim speed of the sweep steps
  floor_max_dist: 0.5      # m, sweep --floor: a step is shortened to this distance (the reverse step brings it back)
  ff_settle_time: 3.0      # s per table speed in the ff test (from rest) before measuring: no start transient
  ff_measure_time: 2.0     # s measured after that (total count change / exact MCU time)
  ff_floor_max_dist: 1.5   # m, ff --floor: longest leg (forward, then the same back); faster points settle shorter
  reply_timeout: 0.2       # s to wait for a parameter reply (get, set, defaults, reload)
  save_timeout: 1.0        # s to wait for the reply to save (the EEPROM write takes up to ~0.35 s)
  attempts: 3              # tries per parameter request (the restore after a test tries only once)
