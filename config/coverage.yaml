# Stage 3 (coverage): robot geometry for coverage, speeds, frames, and the coverage mission settings.
# Read by nala_coverage (params.py) on the Pi and by coverage_tool on the PC.
# The robot outline is NOT here: it comes from robot.yaml (outline: front, back, left, right of base_link).
# Write decimal values with a point (2.0, not 2).
/coverage_config:
  ros__parameters:
    geometry:
      # Margin added to the farthest outline corner. The robot turns on the spot anywhere on its path,
      # so plans keep its centre at least (corner + this) from walls.
      planning_padding_m: 0.02
      # The coverage sensor (scintillator): a disk of this radius around the point sensor_offset_m
      # straight ahead of base_link.
      # PLACEHOLDER: the scintillator position and size are not known yet. Change both, then plan again.
      coverage_disk_radius_m: 0.6
      sensor_offset_m: 0.26
    motion:
      # Coverage driving speeds. Autodrive only drives forwards (the gate passes no negative linear speed
      # from Nav2); manual driving through the gate may reverse.
      # The MCU protocol has steps of 1 mm/s and 1 mrad/s (docs/mcu_protocol.md).
      # 0.15 / 0.5 on 2026-10-26 made the robot weave while driving (time with |turn rate| > 0.3 rad/s while driving
      # 18 % instead of 2-6 %, one robot run). Likely cause: RPP's fixed lookahead_dist 0.2 m asks for faster heading
      # corrections at 0.15 m/s, and the gate's angular_accel_rad_s2 cannot follow them. Back to 0.12 / 0.4 (user).
      linear_m_s: 0.12
      angular_rad_s: 0.4
      # Acceleration limits of the velocity gate (both directions). Floor test 2026-10-16: while the command is
      # above 0 the robot follows only 0.1-0.14 m/s^2 of deceleration; with 0.1 m/s^2 it stopped 3 mm from the
      # goal, 0.3 deg with 0.35 rad/s^2.
      linear_accel_m_s2: 0.1
      angular_accel_rad_s2: 0.35
      # Nav2's controller (RPP max_angular_accel). RPP limits its turn command to the MEASURED turn rate +- this
      # x 0.05 s: with 0.35 it could neither start (0.0175 rad/s, below the breakaway: ~15 s waits at corners, run 8)
      # nor slow down in time (overshoot, extra turns: simulation 2026-10-19, 1500-1800 deg of turning instead of
      # ~900). 3.0 turned well on the robot (drive 7); the one stall there (0.15 rad/s) is what turn_start is for.
      controller_angular_accel_rad_s2: 3.0
      # Velocity gate, Nav2 only: a turn on the spot from standstill asks at least this, ramped at
      # angular_accel_rad_s2 (user decision 2026-10-19). 0.15 did not break away once; 0.35-0.4 always did.
      turn_start_rad_s: 0.3
      # A corner turn (supervisor TURN state) counts a heading as reached within this.
      turn_tolerance_deg: 5.0
      manual_forward_m_s: 0.25
      manual_reverse_m_s: 0.15
      manual_angular_rad_s: 0.5
    runtime:
      map_frame: map
      odom_frame: odom
      base_frame: base_footprint
      map_yaml: ''
      # Base station file. Empty = base_station.yaml next to the map.
      base_station_yaml: ''
      output_dir: output
    planning:
      plan_join_tolerance_m: 0.15
      # Rejoining the plan after a pause a little beside it (user, 2026-10-20: smoothly, without turns on the spot):
      # up to rejoin_max_m from the piece, one path straight to the point rejoin_ahead_m further along it and on
      # along the piece (no planned connection, which turned on the spot twice and upset AMCL in a corner).
      rejoin_max_m: 0.3
      rejoin_ahead_m: 0.4
      stationary_target_length_m: 0.01
      # Plan pieces up to this long (the aimed goals' 5 cm moves) are no separate Nav2 goals: with the stop before
      # them they become one continuous turn on the spot per corner (supervisor TURN; user, 2026-10-19).
      turn_merge_length_m: 0.06
    spur:
      # Drive-ins into pockets the robot cannot turn in (coverage_tool coverage/spurs.py, user 2026-10-20). Driving in
      # is a normal piece of the path (Nav2 follows it); backing out, straight back along the same line, is driven by
      # the supervisor, only over floor the meter has measured (checked before and while backing out). The velocity
      # gate passes a reverse speed only from the supervisor's /cmd_vel_reverse and never more than speed_m_s.
      # User 2026-10-21: back out at the normal driving speed (motion.linear_m_s; was 0.06).
      speed_m_s: 0.12
      # Steering while backing out (on odometry): rad/s per rad of heading error and per m beside the line, no
      # overshoot at speed_m_s (heading_gain^2 >= 4 x track_gain x speed_m_s). Robot 2026-10-20: 2.0 / 20 on the
      # AMCL pose zigzagged +-15-20 deg; 1.5 / 6.0 at 0.06 m/s.
      heading_gain: 1.5
      track_gain: 4.5
      # The end of backing out: between P and this much past it (onto the route), never short of it: the robot turns
      # on the spot there.
      end_tolerance_m: 0.02
      # How far beside its line the robot may be on a drive-in (Nav2's tracking, AMCL): coverage_tool checks the
      # line with this much margin around the outline.
      max_offset_m: 0.05
      # Backing out starts only within planning.rejoin_max_m of the line and this far off its heading; otherwise it
      # is left out where the robot can turn (SPUR_REVERSE_SKIPPED), else a pause (SPUR_OFF_LINE).
      max_heading_error_deg: 10.0
      # LiDAR: a scan point within this distance behind the outline (outline + the planning padding wide) stops
      # backing out (SPUR_REVERSE_BLOCKED). At least the braking distance at speed_m_s (speed^2 / (2 x
      # motion.linear_accel_m_s2) = 0.072 m at 0.12 m/s) plus a reaction step (0.1 s); was 0.06 at 0.06 m/s.
      clear_m: 0.10
    localization:
      position_sigma_m: 0.1
      heading_sigma_deg: 10.0
      # Above position_sigma_m / heading_sigma_deg the robot stops only when the live scan also does not fit the map
      # (matched_ratio), or when AMCL's sigma is this many times the limit (user decision 2026-10-19).
      uncertain_hard_factor: 2.0
      settle_s: 2.0
      min_endpoints: 60
      matched_ratio: 0.65
      match_distance_m: 0.15
      amcl_max_age_s: 2.0
      jump_translation_m: 0.1
      jump_rotation_deg: 10.0
      min_scan_range_m: 0.2
      max_scan_range_m: 12.0
      max_endpoints: 240
      tf_delay_s: 0.1
      pose_rate_hz: 10.0
      tf_cache_s: 10.0
      nomotion_update_period_s: 0.5
      # AMCL may report a variance slightly below zero when it has converged (rounding): down to minus this
      # it counts as zero, below it the pose is AMCL_INVALID.
      covariance_rounding: 1.0e-6
      # AMCL starts at the base station: the supervisor sends it as /initialpose with this spread
      # (how exactly the robot is put on the base station), every period until AMCL reports a pose.
      base_station_sigma_m: 0.1
      base_station_sigma_deg: 10.0
      initial_pose_period_s: 2.0
    health:
      scan_age_s: 0.5
      odom_age_s: 0.5
      battery_age_s: 15.0
      command_age_s: 0.5
      lease_age_s: 0.5
      gate_age_s: 0.5
      meter_age_s: 2.0
      stop_linear_m_s: 0.015
      stop_angular_rad_s: 0.03
      stop_burst_s: 0.15
      gate_rate_hz: 20.0
      graph_period_s: 0.5
      reset_grace_s: 2.0
      future_stamp_tolerance_s: 0.1
      shutdown_stop_messages: 3
      stop_confirm_timeout_s: 1.0
      # Supervisor diagnostics: one log line this often on its step time and how old messages are when handled.
      timing_log_period_s: 5.0
      # NALA's Python nodes use rclpy's EventsExecutor (ros_common.make_executor): far less CPU per message than the
      # default executor (robot 2026-10-20: load 15 on the Pi 4, SCAN_STALE / AMCL_STALE). false: the default one.
      events_executor: true
    measurement:
      max_sample_gap_s: 0.3
      translation_slack_m: 0.05
      rotation_slack_deg: 5.0
      publish_period_s: 0.5
    battery:
      # battery_node (nala_base, INA219) publishes /battery_state. Keep false until the INA219 answers on I2C
      # and the voltage is checked: with true and no battery data the robot does not start (BATTERY_STALE).
      enabled: false
      start_ratio: 0.3
      critical_ratio: 0.15
    deadlines:
      mission_s: 1800.0
      planning_s: 5.0
      target_s: 60.0
      action_accept_s: 5.0
      action_cancel_s: 2.0
      no_motion_s: 15.0
      prepare_s: 15.0
      dwell_s: 0.7
    recovery:
      # A pause for a localization or late-data reason (AUTO_RESUME in supervisor.py) ends by itself once the
      # position is trusted again (settle_s of steady trust), within this time; after it the task stays paused
      # for the operator (user, 2026-10-19: rather localize longer than stop with an error).
      auto_resume_s: 60.0
      endpoint_tolerance_m: 0.1
      plan_endpoint_tolerance_m: 0.05
      short_test_max_m: 2.0
      planner_start_tolerance_m: 0.15
      movement_translation_m: 0.03
      movement_rotation_rad: 0.05
      plan_detour_skip_m: 0.5
      # Failed detours while the robot does not move more than the radius: after this many attempts, or once
      # this much plan has been skipped, pause (BLOCKED_IN_PLACE) instead of skipping on through the plan.
      blocked_in_place_attempts: 12
      blocked_in_place_skip_m: 2.0
      blocked_in_place_radius_m: 0.1
    visualization:
      period_s: 0.5
    radiation:
      # Scintillator readings (/scintillator/count_rate, counts per second, about one per second;
      # docs/scintillator.md). PLACEHOLDERS until the scintillator is tested.
      # false: no background measurement at the start, no avoidance (to drive app 3 without a scintillator).
      enabled: false                  # false until the real background and threshold are known (user, 2026-10-26)
      # Background: the mean of this many readings while the robot stands on the base station at the start.
      background_readings: 10
      background_timeout_s: 30.0      # s, pause the task (NO_SCINTILLATOR) if the background is not ready by then
      # Contamination threshold (user, 2026-10-22): set by the operator on the robot screen (Settings), as a count
      # rate or as a factor x the background; these are the defaults until it is set there. PLACEHOLDERS.
      threshold_mode: background      # 'cps' (threshold_cps) or 'background' (threshold_factor x the background)
      threshold_cps: 100.0            # counts/s
      threshold_factor: 2.0           # x the background (above 1)
      # Contamination found = alarm_readings of the last alarm_window readings at or above the threshold (user:
      # any 2 in a short time). The robot stops like a pause and the task ends; it never drives around it.
      alarm_readings: 2
      alarm_window: 3
      hotspot_join_m: 0.6             # contaminated cells closer than this are one hotspot
      max_gap_s: 0.3                  # a reading is drawn only if the trusted poses of its interval have no larger gap
      pose_history_s: 5.0             # s of measured poses kept to match the readings
      publish_period_s: 1.0           # s, how often the heatmap and the hotspots are published
    map_changes:
      # Cells that changed against the saved map (mapchange_node), from LiDAR scans at trusted poses.
      # Shown on the robot screen: new objects and removed objects. Start values: tune on the robot.
      scan_period_s: 2.0              # s, use at most one scan per this time (CPU on the Pi; 0.5 overloaded it, 2026-10-19)
      beam_step: 4                    # use every 4th beam (CPU on the Pi; was 2)
      max_range_m: 6.0                # m, longer beams are cut here (small heading errors move far points a lot)
      wall_margin_m: 0.10             # m, a few cm of localisation error must not make the walls look changed
      min_hits: 4                     # scans with a beam ending in a free map cell before it is a new object
      hit_ratio: 0.7                  # ... and at least this share of the scans that saw that cell (people walk by)
      min_passes: 6                   # scans with a beam passing through an occupied map cell before it is a removed object
      publish_period_s: 1.0           # s
    locator:
      # Finds the robot on the map from the LiDAR scan while no task drives (locator_node): the screen shows the
      # actual position, and Start needs the robot on the base station the right way round (user, 2026-10-19).
      period_s: 2.0                   # s, one search per period (the Pi 4 needs ~0.6-2 s per search)
      position_step_m: 0.15           # m, grid of the whole-map search (refined to half a map cell afterwards)
      yaw_step_deg: 6.0               # deg, headings of the whole-map search (0.1 m / 4 deg / 90 beams: 3 s on the Pi)
      max_beams: 60                   # scan points used
      match_distance_m: 0.1           # m, a scan point within this of a map wall counts as fitting
      min_fit: 0.7                    # share of fitting points for "on the base station" (good fits: 0.94-0.99)
      base_tolerance_m: 0.15          # m, how far from the base station pose still counts as on it
      base_tolerance_deg: 15.0        # deg, same for the heading
      direction_margin: 0.05          # fit difference for "backwards" and for "clearly better elsewhere"
      ambiguity_margin: 0.05          # another pose within this fit makes the shown pose ambiguous
      max_age_s: 6.0                  # s, an older locator result does not allow Start
