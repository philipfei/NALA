# Robot model for the URDF (src/nala_description/urdf/nala.urdf.xacro). Read by xacro on the Pi.
# Frames: base_footprint and base_link are both on the floor, under the chassis center.
# So laser z below is the height above the floor.
# Body axes: x forward, y left, z up. Yaw: counter-clockwise seen from above, in rad.

# The robot's outer outline: a box around the turning centre (base_link), NOT centred on it.
# Configured only here: the coverage stack (collision radius, Nav2 footprint), coverage_tool, the URDF
# and the simulation all read it. All values are distances from base_link to that edge, in m.
# User, 2026-10-16/19: body 415 x 360 mm centred on the wheel centre, plus a rod 235 mm in front that is
# as wide as the robot (650 mm total length).
outline:
  front: 0.4425       # m, to the rod tip: half body 0.2075 + rod 0.235
  back: 0.2075        # m, half body
  left: 0.180         # m, half body width (the rod is as wide as the body)
  right: 0.180        # m

laser:                # RPLIDAR A2M8 scan center
  x: 0.115            # m, 115 mm in front of the chassis center (moved forward by the user, 2026-10-23; was 0.0)
  y: 0.0              # m
  z: 0.20             # m above the floor. PLACEHOLDER, not measured yet (verify)
  yaw: 3.141593       # rad (180 deg): the LiDAR is mounted facing backward

imu:                  # WT901C-TTL, mounted flat with the chip side up (roll = pitch = 0)
  x: 0.0              # m. PLACEHOLDER, not measured (does not change the turn rate)
  y: 0.0              # m. PLACEHOLDER, not measured
  z: 0.0              # m. PLACEHOLDER, not measured
  yaw: 0.0            # rad. PLACEHOLDER: direction of the IMU x axis (does not change the turn rate)
