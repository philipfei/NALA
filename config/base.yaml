# Pi <-> MCU driver (nala_base/base_node). Runs on the Pi.
# After a change: push from the PC, then `git pull` on the Pi and restart the app.
# Write decimal values with a point (2.0, not 2), or the node stops with a type error.
base_node:
  ros__parameters:
    # MCU link: UART (firmware v2.1.0, binary frames). Pi GPIO14 TX / GPIO15 RX, level shifter, MCU PD0 RX / PD1 TX.
    serial_port: /dev/ttyAMA0   # PL011 UART on GPIO14/15 (dtoverlay=miniuart-bt, see scripts/setup_pi.sh)
    baud_rate: 38400            # must match UART_BAUD in firmware config.h

    # Motor limit: the fastest wheel rim speed the motors really reach (= wheel rad/s x wheel radius).
    # If a command needs a faster wheel (for example strafe + turn at full stick), the Pi scales
    # vx, vy and wz down together, so the path keeps its shape. The input speeds are in teleop.yaml.
    max_wheel_speed: 0.45       # m/s. Measured top speed at 100 % PWM 0.50-0.52 m/s (slowest M4), minus 10 %
                                # so the speed controller keeps some room to drive straight (2026-10-07)

    cmd_vel_timeout: 0.6        # s, send zero speed if /cmd_vel is older than this.
                                # Keep it above the PC key-repeat delay (0.5 s), or teleop stutters.
    command_rate: 20.0          # Hz, how often the current command is sent to the MCU.
                                # The MCU stops after 200 ms without a valid command, so keep it at 20 Hz (>= 7 Hz).

    # Wheel odometry (/odom, and TF odom -> base_footprint if publish_tf) from the MCU encoder counts.
    # Must match the robot (and the firmware config.h). Careful: radius, not diameter; half, not full.
    wheel_radius: 0.040         # m (diameter 0.080)
    half_track_width: 0.160     # m, half of the left-right wheel distance (full 0.320)
    half_wheelbase: 0.170       # m, half of the front-rear axle distance (full 0.340; measured by the user, 2026-10-19)
    encoder_counts_per_rev: 1536   # encoder counts per wheel turn (checked: 1.17 m driven = 1.17 m odometry)
    feedback_period: 0.05       # s, MCU control period (firmware CONTROL_PERIOD_MS): one state frame per period,
                                # time base of the odometry speeds
    feedback_timeout: 0.5       # s, warn if no valid state frame comes for this long
    publish_tf: true            # TF odom -> base_footprint. App 2 turns it off: there the EKF publishes it
    odom_twist_variance: [0.0025, 0.01]   # (m/s)^2 for vx, vy in /odom, weights for the EKF. Start values:
                                          # vx 0.05 m/s, vy 0.1 m/s std (mecanum strafe slips more)
