# Pi <-> MCU driver (nala_base/base_node). Runs on the Pi.
# After a change: push from the PC, then `git pull` on the Pi and restart the app.
# Write decimal values with a point (2.0, not 2), or the node stops with a type error.
base_node:
  ros__parameters:
    serial_port: /dev/ttyS0     # Pi GPIO UART to the MCU
    baud_rate: 9600             # must match the firmware (UART_BAUD in firmware config.h)

    max_linear_speed: 1.0       # m/s, limit for the (x, y) speed. Protocol max is 2.54
    max_angular_speed: 1.0      # rad/s, limit for the turn speed. Protocol max is 2.54

    cmd_vel_timeout: 0.6        # s, send zero speed if /cmd_vel is older than this.
                                # Keep it above the PC key-repeat delay (0.5 s), or teleop stutters.
    command_rate: 20.0          # Hz, how often the current command is sent to the MCU.
                                # The MCU stops after 200 ms without a frame (firmware v1), so keep it at 20 Hz (>= 7 Hz).

    # Wheel odometry (/odom and TF odom -> base_footprint) from the measured wheel speeds.
    # Must match the robot (and the firmware config.h). Careful: radius, not diameter; half, not full.
    wheel_radius: 0.040         # m (diameter 0.080)
    half_track_width: 0.160     # m, half of the left-right wheel distance (full 0.320)
    half_wheelbase: 0.130       # m, half of the front-rear axle distance (full 0.260)
    feedback_timeout: 0.5       # s, warn if no wheel speeds come for this long (the MCU sends every 0.1 s)
