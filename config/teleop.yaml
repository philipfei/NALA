# Driving by hand: keyboard (runs on the PC) and Xbox controller (runs on the Pi,
# the controller is paired with the Pi over Bluetooth).
# The speeds are fixed here. They cannot be changed while driving.
# The Pi scales a command down if a wheel would be faster than max_wheel_speed, and up if its fastest wheel
# would be slower than min_wheel_speed (base.yaml).
# Write decimal values with a point (1.0, not 1), or the node stops with a type error.

keyboard_teleop:                # PC: nala_teleop keyboard_teleop
  ros__parameters:
    linear_speed: 0.45          # m/s, speed of the drive keys (= max_wheel_speed in base.yaml: the motors cannot go faster)
    angular_speed: 0.6          # rad/s, speed of the turn keys (2026-10-26, user: 0.6, was 0.5; a faster turn gives
                                # a stalled wheel more PWM. 1.0 until 2026-10-16, slower is better for SLAM)

joy_node:                       # Pi: reads the Xbox controller (package joy)
  ros__parameters:
    device_id: 0                # first game controller
    deadzone: 0.15              # stick values below this count as exactly 0 (range 0..1). Measured 2026-10-16: the left
                                # stick rests at up to ~0.12, so 0.05 let the robot creep and xbox_teleop never saw 0
    autorepeat_rate: 20.0       # Hz, repeat /joy while held, so /cmd_vel keeps coming

xbox_teleop:                    # Pi: /joy -> /cmd_vel (nala_teleop xbox_teleop; replaced teleop_twist_joy 2026-10-16)
  ros__parameters:
    enable_button: 4            # LB: hold it to drive. Release = stop (checked 2026-10-07).
                                # After pressing LB, both sticks must be centred once before the robot drives.
    axis_linear_x: 1            # left stick up/down: forward/backward
    axis_linear_y: 0            # left stick left/right: move sideways
    axis_angular_yaw: 3         # right stick left/right: turn (axes 2 and 5 are the triggers)
    scale_linear_x: 0.45        # m/s at full stick (= max_wheel_speed in base.yaml: the motors cannot go faster)
    scale_linear_y: 0.45        # m/s at full stick
    scale_angular_yaw: 0.6      # rad/s at full stick (same as angular_speed above)
    joy_timeout: 0.2            # s, no /joy for this long while LB is held (controller lost) -> stop.
                                # joy_node repeats /joy at autorepeat_rate (20 Hz), so this is 4 messages

xbox_pause:                     # Pi, app 3 only: B pauses the coverage task (nala_coverage xbox_pause).
  ros__parameters:              # App 3 does not drive with the controller (only the velocity gate drives).
    pause_button: 1             # B in joy (SDL): A = 0, B = 1 (checked on our controller 2026-10-16)
