# Stage 3 (coverage): localization in the saved map (AMCL) and the map server. Runs on the Pi.
# frame ids, the map file and the initial pose (the base station) are set at launch by nala_coverage (params.py).
# AMCL values were tuned in simulation only.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.2
    laser_max_range: 12.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.025
    update_min_a: 0.05
    # Heading noise from turning. 0.03 (user decision 2026-10-19; was 0.05): the heading comes from the IMU gyro.
    # 0.02 together with alpha4 0.01 made AMCL too sure: it kept a pose 0.6 m off (sigma 0.017 m, robot 2026-10-19).
    alpha1: 0.03
    alpha2: 0.05
    alpha3: 0.05
    # Position noise from turning (differential model). 0.03 (user decision 2026-10-19; was 0.05): the LiDAR is at
    # the turning centre. With 0.05 the position sigma passed the 0.10 m trust limit in turns, with 0.01 AMCL was too
    # sure to correct itself (both robot, 2026-10-19; the first run may also have started with the robot backwards).
    alpha4: 0.03
    alpha5: 0.05
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: -1.0
map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: map
