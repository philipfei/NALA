# robot_localization EKF (app 2): wheel odometry + IMU -> TF odom -> base_footprint. Runs on the Pi.
# Why this setup: docs/imu_ekf.md.
#  - Translation (vx, vy) only from the wheels (/odom). Their weight: odom_twist_variance in base.yaml.
#  - Turn rate (vyaw) only from the IMU gyro (/imu): mecanum wheels slip when turning, the gyro does not.
#    Weight: angular_velocity_variance in imu.yaml.
#  - Not used: IMU orientation (no magnetometer: indoor magnetic fields are distorted),
#    IMU acceleration (too noisy to integrate), wheel turn rate.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0               # Hz, filter output rate
    sensor_timeout: 0.2           # s
    two_d_mode: true              # flat floor: no z, roll, pitch
    transform_timeout: 0.1        # s, wait this long for the imu_link transform (from robot_state_publisher)
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
