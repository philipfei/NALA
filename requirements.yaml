# NALA requirements
# Master list of system versions and dependencies.
# Update this file whenever a dependency is added or removed.
#
# Packages are grouped by the first application (stage) that needs them:
#   stage_1 = keyboard teleop, stage_2 = SLAM mapping, stage_3 = coverage.
#
# Python libraries are installed with apt (python3-*), not pip.
# Ubuntu 24.04 blocks system-wide pip installs (PEP 668).

system:
  pc:
    os: Ubuntu 24.04
    architecture: amd64
    ros: jazzy
    python: "3.12"
  pi:
    model: Raspberry Pi 4B, 8 GB RAM
    os: Ubuntu 24.04
    architecture: arm64
    ros: jazzy
    python: "3.12"
    user: nala
  firmware:
    mcu: ATmega328PB, 16 MHz
    ide: Microchip Studio (Windows)   # build
    device_pack: ATmega_DFP 1.7.374   # from motor_driver_C.cproj (firmware v1.1.0, owned by a teammate)
    flash_tool: avrdude 8.0 (from the Arduino IDE), ArduinoISP   # see firmware/README.md section 5
    linker_flags: -lprintf_flt        # needed for %f in sprintf

apt:
  # The Pi follows the PC: if versions conflict, the Pi uses what the PC has.
  # PC packages are never reinstalled without the user's approval.
  pc:
    stage_1:
      - ros2-apt-source 1.3.0               # ROS 2 apt repository (already installed)
      - ros-jazzy-ros-base                  # ROS 2 (installed; the PC has no ros-jazzy-desktop)
      - ros-jazzy-rmw-cyclonedds-cpp        # DDS (installed; the only RMW on the PC)
      - python3-colcon-*                    # build tool (installed as single colcon packages)
      - python3-pytest                      # unit tests (installed)
      - git
    stage_2:
      - ros-jazzy-rviz2                     # RViz (installed)
    stage_3:                                # optional on the PC: RViz, base station picker, planning, simulation
      - ros-jazzy-nav2-map-server           # show the saved map to pick the base station
      - ros-jazzy-nav2-lifecycle-manager    # activates the map server of the base station picker
      - python3-numpy                       # nala_coverage, coverage_tool
      - python3-pil                         # map images
      - python3-yaml
      - python3-scipy                       # coverage_tool, tools/sim
      - python3-matplotlib                  # coverage_tool images
      - python3-tk                          # coverage_tool/app.py (interactive planner)
      - python3-pyqt5                       # nala_panel tests (offscreen) and the panel on the PC
      - ros-jazzy-navigation2               # only for tools/sim (app 3 with a fake robot on the PC)
      - ros-jazzy-robot-state-publisher     # tools/sim (robot model)
      - ros-jazzy-xacro                     # tools/sim (robot model)
  pi:
    stage_1:                                # installed by scripts/setup_pi.sh, in this order
      - ros2-apt-source 1.3.0               # same version as the PC
      - ros-jazzy-rmw-cyclonedds-cpp        # first, so ros-base uses Cyclone (like the PC), not Fast DDS
      - ros-jazzy-ros-base                  # ROS 2 without GUI tools
      - python3-serial                      # pyserial: UART to the MCU
      - python3-pytest                      # unit tests
      - python3-colcon-common-extensions    # build tool
      - git
      - avahi-daemon                        # mDNS: ssh nala@nala.local
      - ros-jazzy-joy                       # Xbox controller -> /joy (SDL2). User nala must be in group input
      - ros-jazzy-teleop-twist-joy          # /joy -> /cmd_vel
    stage_2:                                # installed by scripts/setup_pi.sh
      - ros-jazzy-rplidar-ros               # RPLIDAR A2M8 driver
      - ros-jazzy-robot-state-publisher     # publish robot frames from the URDF
      - ros-jazzy-xacro                     # URDF macros
      - ros-jazzy-slam-toolbox              # 2D SLAM (mapping and localization)
      - ros-jazzy-nav2-map-server           # map_saver_cli: save the map
    stage_3:                                # installed by scripts/setup_pi_screen.sh
      - ros-jazzy-navigation2               # map server, AMCL, planner (NavFn), controller (RPP), lifecycle manager
      - python3-pyqt5                       # robot screen (nala_panel)
      - python3-matplotlib                  # map drawing on the robot screen, plan images (coverage_tool)
      - python3-scipy                       # coverage_tool (planning on the Pi)
      - python3-pil                         # map images
      - python3-numpy
      - python3-yaml
      - xserver-xorg                        # small desktop for the robot screen (--no-install-recommends)
      - xinit
      - xfce4
      - lightdm                             # automatic login of user nala
      - lightdm-gtk-greeter
      - x11-xserver-utils                   # xset: keep the screen on

pip: []   # none

network:
  pi_ssh: nala@nala.local            # Pi hostname NALA
  robot_lan: 10.42.0.0/24            # PC USB Ethernet 10.42.0.1 shares the connection; Pi on WiFi
  ros_domain_id: 0                   # same on PC and Pi (config/ros_env.sh)
  rmw: rmw_cyclonedds_cpp            # config/ros_env.sh, config/cyclonedds.xml
  pc_firewall: ufw must allow 10.42.0.0/24
  time_sync: PC and Pi clocks must match (TF across machines). Both use NTP.
