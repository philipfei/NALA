# NALA requirements
# Master list of system versions and dependencies.
# Update this file whenever a dependency is added or removed.
#
# Packages are grouped by the first application (stage) that needs them:
#   stage_1 = keyboard teleop, stage_2 = SLAM mapping, stage_3 = coverage.
# stage_2 and stage_3 lists are the current plan. Confirm them when that stage starts.
#
# Python libraries are installed with apt (python3-*), not pip.
# Ubuntu 24.04 blocks system-wide pip installs (PEP 668).

system:
  pc:
    os: Ubuntu 24.04
    architecture: amd64
    ros: jazzy
    python: "3.12"
  pi:
    model: Raspberry Pi 4B, 8 GB RAM
    os: Ubuntu 24.04
    architecture: arm64
    ros: jazzy
    python: "3.12"
    user: nala
  firmware:
    mcu: ATmega328PB, 16 MHz
    ide: Microchip Studio (Windows)   # build and flash
    device_pack: ATmega_DFP 1.6.364   # from motor_driver_C.cproj
    linker_flags: -lprintf_flt        # needed for %f in sprintf

apt:
  pc:
    stage_1:
      - ros-jazzy-desktop                   # ROS 2 + RViz 2
      - ros-jazzy-teleop-twist-keyboard     # keyboard teleop
      - python3-pytest                      # unit tests
      - python3-colcon-common-extensions    # build tool
      - python3-rosdep                      # install ROS deps from package.xml
      - git
    stage_2: []                             # RViz is in ros-jazzy-desktop
    stage_3:
      - ros-jazzy-nav2-map-server           # show the saved map to pick the base station
  pi:
    stage_1:
      - ros-jazzy-ros-base                  # ROS 2 without GUI tools
      - python3-serial                      # pyserial: UART to the MCU
      - python3-pytest                      # unit tests
      - python3-colcon-common-extensions
      - python3-rosdep
      - git
      - avahi-daemon                        # mDNS: ssh nala@<PI_HOSTNAME>.local
    stage_2:
      - ros-jazzy-rplidar-ros               # RPLIDAR A2M8 driver
      - ros-jazzy-robot-state-publisher     # publish robot frames from the URDF
      - ros-jazzy-xacro                     # URDF macros
      - ros-jazzy-slam-toolbox              # 2D SLAM (mapping and localization)
      - ros-jazzy-nav2-map-server           # map_saver_cli: save the map
    stage_3:
      - ros-jazzy-navigation2               # Nav2: path following, costmaps
      - ros-jazzy-nav2-bringup

pip: []   # none

network:
  pi_ssh: nala@<PI_HOSTNAME>.local   # hostname not known yet
  ros_domain_id: null                # set in stage 1; must be the same on PC and Pi
  time_sync: PC and Pi clocks must match (TF across machines). Check in stage 2.
